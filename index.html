<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRFTINTO GHO - Tow & Rescue</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:#fff}
.header{background:#b91c1c;padding:20px;text-align:center}
.card{background:#1f1f1f;border-radius:16px;padding:20px;margin:20px;border:1px solid #333}
.btn{display:block;width:100%;padding:16px;background:#dc2626;color:#fff;text-align:center;border-radius:12px;font-weight:bold;font-size:18px;text-decoration:none;margin-top:12px}
.btn-green{background:#16a34a}
.btn-blue{background:#2563eb}
.contact-box{background:#fff;color:#111;border-radius:12px;padding:15px;text-align:center;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="header">
<h1>KRFTINTO GHO</h1>
<p>24/7 Tow & Road Rescue - Gaborone</p>
</div>

<div class="card">
<h2>🚨 Need Tow NOW?</h2>
<a class="btn" href="tel:+26772665835">📞 CALL: 72 665 835</a>
<a class="btn btn-green" href="tel:+26775985570">📞 CALL: 75 985 570</a>
<a class="btn btn-blue" href="https://wa.me/26772665835?text=Hello%20KRFTINTO%20I%20need%20tow">💬 WhatsApp Location</a>
</div>

<div class="card">
<h2>📍 Location</h2>
<p id="loc">Getting GPS...</p>
</div>

<div class="card">
<h2>📞 Official Contacts</h2>
<div class="contact-box">
+267 72 665 835 / +267 75 985 570<br>
KRFTINTO GHO - Gaborone
</div>
</div>

<script>
navigator.geolocation.getCurrentPosition(p=>{
document.getElementById('loc').innerText=`Lat:${p.coords.latitude.toFixed(5)} Lng:${p.coords.longitude.toFixed(5)}`
})
</script>
</body>
</html>
