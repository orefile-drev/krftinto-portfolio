<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRFTINTO GHO - Full System</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial} body{background:#0f0f0f;color:#fff}
.top{background:#b91c1c;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:999}
.top button{padding:7px 12px;border-radius:20px;border:1px solid #fff;background:#000;color:#fff;font-weight:900;font-size:11px}
#map{height:28vh}
.card{background:#1e1e1e;margin:8px;padding:12px;border-radius:14px;border:1px solid #333}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.svc{background:#2a2a2a;border:2px solid #333;padding:9px;border-radius:10px;text-align:center;font-size:12px;cursor:pointer}
.svc.on{border-color:#f59e0b;background:#3d2f14}
.btn{width:100%;padding:12px;border-radius:12px;font-weight:900;border:none;color:#fff;margin-top:7px}
.o{background:#ea580c}.g{background:#16a34a}.d{background:#000;border:1px solid #444}.bl{background:#2563eb}
input,select,textarea{width:100%;padding:10px;border-radius:8px;background:#111;border:1px solid #444;color:#fff;margin-top:6px;font-size:14px}
.pay{display:flex;gap:6px;margin-top:6px}
.pay div{flex:1;background:#2a2a2a;border:2px solid #333;padding:8px;border-radius:8px;text-align:center;font-size:11px;cursor:pointer}
.pay div.on{border-color:#16a34a;background:#1a2e1a}
.stars{font-size:22px;color:#555;cursor:pointer}.stars.on{color:#f59e0b}
.req{background:#111;padding:10px;border-radius:10px;margin-top:8px;border-left:4px solid #ea580c}
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:900}.online{background:#16a34a}
</style>
</head>
<body>
<div class="top">
<b>🚛 KRFTINTO GHO</b>
<div><button onclick="showView('cust')">CUSTOMER</button> <button onclick="showView('mech')">MECHANIC</button></div>
</div>
<div id="map"></div>

<div id="custView">
<div class="card">
<div style="display:flex;justify-content:space-between"><small style="color:#aaa">SELECT SERVICE</small><b id="priceTag" style="background:#fff;color:#111;padding:2px 10px;border-radius:20px">P250</b></div>
<div class="grid" style="margin-top:8px">
<div class="svc on" onclick="pick(this,'Tow Truck',250,'🚛')">🚛<br>Tow</div>
<div class="svc" onclick="pick(this,'Mechanic',200,'🔧')">🔧<br>Mech</div>
<div class="svc" onclick="pick(this,'Tyre',120,'🛞')">🛞<br>Tyre</div>
<div class="svc" onclick="pick(this,'Battery',100,'🔋')">🔋<br>Batt</div>
<div class="svc" onclick="pick(this,'Fuel',150,'⛽')">⛽<br>Fuel</div>
<div class="svc" onclick="pick(this,'Rescue',300,'🚨')">🚨<br>Rescue</div>
</div>

<select id="custTown">
<option>Gaborone</option><option>Mahalapye</option><option>Palapye</option><option>Serowe</option><option>Francistown</option><option>Maun</option><option>Kanye</option><option>Molepolole</option><option>Lobatse</option>
</select>

<input id="cName" placeholder="Your Name">
<input id="cPhone" placeholder="Phone 72xxxxxx">

<label style="color:#aaa;font-size:11px;margin-top:8px;display:block">📝 DESCRIPTION - What happened to car?</label>
<textarea id="cDesc" rows="2" placeholder="e.g. Car overheated near Mahalapye mall, white Toyota Hilux, steam coming from engine..."></textarea>

<label style="color:#aaa;font-size:11px;margin-top:8px;display:block">💳 PAYMENT METHOD</label>
<div class="pay">
<div class="on" onclick="setPay(this,'Cash')"><div>💵</div>Cash</div>
<div onclick="setPay(this,'Orange Money')"><div>🟠</div>Orange Money</div>
<div onclick="setPay(this,'MyZaka')"><div>📱</div>MyZaka</div>
<div onclick="setPay(this,'Card')"><div>💳</div>Card</div>
</div>

<input id="cLoc" readonly style="color:#4ade80;margin-top:8px" value="GPS: Getting...">
<div style="background:#111;padding:8px;border-radius:8px;margin-top:6px;font-size:11px">Mechanics in <b id="townLabel" style="color:#f59e0b">Gaborone</b>: <span id="mechCount">2 online</span> | ETA 7-15 mins</div>
<button class="btn o" onclick="requestNow()">🚀 REQUEST RESCUE NOW</button>
</div>

<div class="card" id="custTrack" style="display:none;border:2px solid #16a34a">
<h3>🟢 Help Coming!</h3><p id="trackInfo" style="font-size:13px;margin-top:6px"></p><p id="trackDesc" style="font-size:11px;color:#aaa;margin-top:4px;background:#111;padding:6px;border-radius:6px"></p>
<p id="trackPay" style="font-size:12px;margin-top:4px"></p>

<div style="margin-top:10px;background:#111;padding:10px;border-radius:10px">
<small style="color:#aaa">⭐ RATE YOUR MECHANIC AFTER JOB</small>
<div style="margin-top:6px"><span class="stars" onclick="rate(1)">★</span><span class="stars" onclick="rate(2)">★</span><span class="stars" onclick="rate(3)">★</span><span class="stars" onclick="rate(4)">★</span><span class="stars" onclick="rate(5)">★</span></div>
<textarea id="rateComment" placeholder="Comment - e.g. Came fast, good service" style="margin-top:6px"></textarea>
<button class="btn bl" onclick="submitRating()">Submit Rating</button>
</div>

<button class="btn g" onclick="callMain()">📞 Call Control Room</button><button class="btn d" onclick="cancelReq()">Cancel</button>
</div>
</div>

<div id="mechView" style="display:none">
<div class="card" id="regCard">
<h3>🔧 JOIN AS MECHANIC</h3>
<input id="mName" placeholder="Your Name">
<input id="mPhone" placeholder="Phone 72xxxxxx">
<select id="mTown"><option>Gaborone</option><option>Mahalapye</option><option>Palapye</option><option>Serowe</option><option>Francistown</option><option>Maun</option><option>Kanye</option><option>Molepolole</option><option>Lobatse</option></select>
<select id="mService"><option>Tow Truck & All</option><option>Mechanic Only</option><option>Tyre Specialist</option></select>
<input id="mOrange" placeholder="Orange Money Number for Payment">
<button class="btn bl" onclick="registerMech()">✅ REGISTER</button>
</div>

<div class="card" id="dashCard" style="display:none;border-color:#f59e0b">
<h3>🔧 Dashboard <span class
