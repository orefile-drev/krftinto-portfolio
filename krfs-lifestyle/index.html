<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Krf's Lifestyle</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

#game {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* WORLD */

#world {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
        linear-gradient(
            #82c9f5 0%,
            #bde5ff 42%,
            #82b85c 43%,
            #6fa34e 100%
        );
}

#sun {
    position: absolute;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #ffe66d;
    box-shadow: 0 0 35px rgba(255,230,109,.8);
    top: 9%;
    right: 12%;
}

/* ROAD */

#road {
    position: absolute;
    width: 180px;
    height: 150%;
    left: 50%;
    top: -20%;
    transform: translateX(-50%) rotate(0deg);
    background: #383838;
    border-left: 10px solid #555;
    border-right: 10px solid #555;
}

.road-line {
    position: absolute;
    width: 7px;
    height: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #f5f5f5;
}

.line1 { top: 3%; }
.line2 { top: 23%; }
.line3 { top: 43%; }
.line4 { top: 63%; }
.line5 { top: 83%; }

/* SIDE ROADS */

.side-road {
    position: absolute;
    background: #444;
}

.side-road.horizontal {
    width: 100%;
    height: 80px;
    top: 56%;
    left: 0;
}

/* BUILDINGS */

.building {
    position: absolute;
    width: 105px;
    height: 80px;
    background: #d7b48a;
    border: 4px solid #7b5c3d;
    border-radius: 6px;
    box-shadow: 0 7px 0 rgba(0,0,0,.15);
}

.building::before {
    content: "";
    position: absolute;
    left: 15px;
    right: 15px;
    top: 18px;
    height: 24px;
    background: #8ed0e8;
    border: 3px solid #654;
}

.building::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 32px;
    left: 40px;
    bottom: 0;
    background: #68462f;
}

.b1 { left: 5%; top: 28%; }
.b2 { right: 4%; top: 35%; }
.b3 { left: 5%; top: 68%; }
.b4 { right: 4%; top: 75%; }

.shop {
    background: #f2d05c;
}

/* TREES */

.tree {
    position: absolute;
    width: 55px;
    height: 75px;
}

.tree::before {
    content: "";
    position: absolute;
    width: 42px;
    height: 42px;
    left: 6px;
    top: 0;
    border-radius: 50%;
    background: #26733b;
    box-shadow:
        -13px 12px 0 #2d8142,
        14px 13px 0 #246b36;
}

.tree::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 34px;
    left: 23px;
    top: 40px;
    background: #70472c;
}

.t1 { left: 28%; top: 15%; }
.t2 { right: 25%; top: 20%; }
.t3 { left: 20%; top: 82%; }
.t4 { right: 20%; top: 87%; }

/* LABELS */

.location-label {
    position: absolute;
    padding: 5px 8px;
    background: rgba(0,0,0,.65);
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
}

/* CAR */

#car {
    position: absolute;
    width: 62px;
    height: 105px;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    z-index: 10;
}

.car-body {
    position: absolute;
    width: 62px;
    height: 100px;
    background: #facc15;
    border-radius: 17px 17px 12px 12px;
    border: 3px solid #111;
    box-shadow: 0 5px 12px rgba(0,0,0,.45);
}

.window {
    position: absolute;
    width: 43px;
    height: 28px;
    left: 7px;
    top: 12px;
    background: #172b3a;
    border: 3px solid #111;
    border-radius: 8px;
}

.window2 {
    top: 47px;
}

.light {
    position: absolute;
    width: 13px;
    height: 7px;
    background: #fff4a3;
    border-radius: 5px;
    bottom: 5px;
}

.left-light { left: 7px; }
.right-light { right: 7px; }

.wheel {
    position: absolute;
    width: 10px;
    height: 25px;
    background: #111;
    border-radius: 5px;
}

.wl1 { left: -7px; top: 15px; }
.wl2 { right: -7px; top: 15px; }
.wl3 { left: -7px; bottom: 15px; }
.wl4 { right: -7px; bottom: 15px; }

/* HUD */

#hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    gap: 6px;
}

.hud-box {
    background: rgba(17,24,39,.88);
    border: 1px solid rgba(255,255,255,.15);
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 12px;
    min-width: 75px;
}

#money {
    color: #facc15;
    font-weight: bold;
}

/* MENU */

#menu {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    text-align: center;
    background:
        linear-gradient(
            rgba(0,0,0,.68),
            rgba(0,0,0,.78)
        );
}

.logo {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 8px;
    color: #d1d5db;
}

.botswana {
    margin-top: 12px;
    font-size: 17px;
}

.play-button {
    margin-top: 35px;
    width: 220px;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #facc15;
    color: #111827;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 5px 0 #a87900;
}

.play-button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #a87900;
}

/* CONTROLS */

#controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 15px;
    height: 115px;
    z-index: 30;
    pointer-events: none;
}

.control {
    position: absolute;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(17,24,39,.78);
    color: white;
    font-size: 23px;
    pointer-events: auto;
    touch-action: none;
}

.control:active {
    background: #facc15;
    color: #111;
}

#left {
    left: 20px;
    bottom: 15px;
}

#right {
    left: 155px;
    bottom: 15px;
}

#up {
    left: 88px;
    bottom: 65px;
}

#down {
    left: 88px;
    bottom: 0;
}

#drive {
    right: 22px;
    bottom: 20px;
    width: 78px;
    height: 78px;
    font-size: 15px;
    font-weight: bold;
    background: rgba(250,204,21,.9);
    color: #111;
}

/* INFO */

#info {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    background: rgba(0,0,0,.55);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 10px;
    white-space: nowrap;
}

/* WEATHER */

#rain {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    background:
        repeating-linear-gradient(
            105deg,
            transparent 0,
            transparent 14px,
            rgba(255,255,255,.22) 15px,
            transparent 16px
        );
}

body.raining #rain {
    opacity: 1;
    animation: rain 0.35s linear infinite;
}

@keyframes rain {
    from { transform: translateY(-20px); }
    to { transform: translateY(20px); }
}

/* MOBILE */

@media (min-width: 700px) {
    #game {
        max-width: 500px;
        margin: auto;
        border-left: 2px solid #333;
        border-right: 2px solid #333;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="world">

        <div id="sun"></div>

        <div id="road">
            <div class="road-line line1"></div>
            <div class="road-line line2"></div>
            <div class="road-line line3"></div>
            <div class="road-line line4"></div>
            <div class="road-line line5"></div>
        </div>

        <div class="side-road horizontal"></div>

        <div class="building b1">
            <div class="location-label">HOUSE</div>
        </div>

        <div class="building shop b2">
            <div class="location-label">SHOP</div>
        </div>

        <div class="building b3">
            <div class="location-label">HOUSE</div>
        </div>

        <div class="building shop b4">
            <div class="location-label">STORE</div>
        </div>

        <div class="tree t1"></div>
        <div class="tree t2"></div>
        <div class="tree t3"></div>
        <div class="tree t4"></div>

        <div id="car">

            <div class="car-body">
                <div class="window"></div>
                <div class="window window2"></div>

                <div class="light left-light"></div>
                <div class="light right-light"></div>

                <div class="wheel wl1"></div>
                <div class="wheel wl2"></div>
                <div class="wheel wl3"></div>
                <div class="wheel wl4"></div>
            </div>

        </div>

        <div id="rain"></div>

    </div>

    <!-- HUD -->

    <div id="hud">

        <div class="hud-box">
            💰 <span id="money">P20.00</span>
        </div>

        <div class="hud-box">
            ⛽ <span id="fuel">100%</span>
        </div>

        <div class="hud-box">
            📍 Botswana
        </div>

    </div>

    <!-- MENU -->

    <div id="menu">

        <div class="logo">KRF'S LIFESTYLE</div>

        <div class="subtitle">
            Botswana Open World
        </div>

        <div class="botswana">
            🇧🇼 Welcome to Botswana 🇧🇼
        </div>

        <button class="play-button" onclick="startGame()">
            PLAY
        </button>

        <div style="margin-top:20px;font-size:12px;color:#aaa;">
            Version 0.1
        </div>

    </div>

    <!-- CONTROLS -->

    <div id="controls">

        <button class="control" id="up">▲</button>
        <button class="control" id="left">◀</button>
        <button class="control" id="right">▶</button>
        <button class="control" id="down">▼</button>

        <button class="control" id="drive">
            DRIVE
        </button>

    </div>

    <div id="info">
        Use the controls to drive around Botswana
    </div>

</div>

<script>

let playing = false;

let carX = 50;
let carY = 0;

let speed = 0;

let fuel = 100;

let money = 20;

let raining = false;

const car = document.getElementById("car");
const world = document.getElementById("world");

const fuelText = document.getElementById("fuel");
const moneyText = document.getElementById("money");

function startGame() {

    playing = true;

    document.getElementById("menu").style.display = "none";

    document.getElementById("info").innerText =
        "Krf's Lifestyle started — drive safely!";

}

function updateCar() {

    car.style.left = carX + "%";

}

function moveLeft() {

    if (!playing) return;

    carX -= 2;

    if (carX < 8) carX = 8;

    updateCar();

}

function moveRight() {

    if (!playing) return;

    carX += 2;

    if (carX > 92) carX = 92;

    updateCar();

}

function moveForward() {

    if (!playing) return;

    if (fuel <= 0) return;

    speed = 1;

    fuel -= 0.5;

    if (fuel < 0) fuel = 0;

    fuelText.innerText =
        Math.round(fuel) + "%";

    animateRoad();

}

function moveBackward() {

    if (!playing) return;

    speed = -1;

    animateRoad();

}

function animateRoad() {

    if (!playing) return;

    const current =
        parseFloat(
            getComputedStyle(world).backgroundPositionY
        ) || 0;

    world.style.backgroundPositionY =
        (current + speed * 20) + "px";

}

/* TOUCH CONTROLS */

document.getElementById("left")
.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveLeft();
});

document.getElementById("right")
.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveRight();
});

document.getElementById("up")
.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveForward();
});

document.getElementById("down")
.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveBackward();
});

document.getElementById("drive")
.addEventListener("touchstart", function(e) {
    e.preventDefault();

    if (!playing) return;

    moveForward();

});

/* MOUSE / DESKTOP SUPPORT */

document.getElementById("left")
.addEventListener("click", moveLeft);

document.getElementById("right")
.addEventListener("click", moveRight);

document.getElementById("up")
.addEventListener("click", moveForward);

document.getElementById("down")
.addEventListener("click", moveBackward);

document.getElementById("drive")
.addEventListener("click", moveForward);

/* KEYBOARD */

document.addEventListener("keydown", function(e) {

    if (!playing) return;

    if (e.key === "ArrowLeft")
        moveLeft();

    if (e.key === "ArrowRight")
        moveRight();

    if (e.key === "ArrowUp")
        moveForward();

    if (e.key === "ArrowDown")
        moveBackward();

});

/* DAY / NIGHT */

let hour = 8;

setInterval(function() {

    if (!playing) return;

    hour += 0.05;

    if (hour >= 24)
        hour = 0;

    let night =
        hour >= 19 || hour <= 5;

    if (night) {

        world.style.filter =
            "brightness(.55)";

        document.getElementById("sun").style.opacity =
            "0.25";

    } else {

        world.style.filter =
            "brightness(1)";

        document.getElementById("sun").style.opacity =
            "1";

    }

}, 1000);

/* WEATHER */

setInterval(function() {

    if (!playing) return;

    raining = Math.random() > 0.75;

    if (raining) {

        document.body.classList.add("raining");

        document.getElementById("info").innerText =
            "🌧️ Rain has started in Botswana";

    } else {

        document.body.classList.remove("raining");

        document.getElementById("info").innerText =
            "☀️ Weather is clear";

    }

}, 15000);

/* SAVE */

setInterval(function() {

    if (!playing) return;

    localStorage.setItem(
        "krf_money",
        money
    );

    localStorage.setItem(
        "krf_fuel",
        fuel
    );

}, 5000);

/* LOAD */

const savedMoney =
    localStorage.getItem("krf_money");

const savedFuel =
    localStorage.getItem("krf_fuel");

if (savedMoney !== null) {

    money =
        parseFloat(savedMoney);

    moneyText.innerText =
        "P" + money.toFixed(2);

}

if (savedFuel !== null) {

    fuel =
        parseFloat(savedFuel);

    fuelText.innerText =
        Math.round(fuel) + "%";

}

</script>

</body>
  </html>
